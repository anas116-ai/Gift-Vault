<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiftVault Luxury Motion Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-night: #000411;
      --c-crimson: #F8333C;
      --c-emerald: #036D19;
      --c-gold: #E5A93C;
      --c-base: #FAF9F6;
      --c-border: #E2E8F0;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--c-base);
      color: var(--c-night);
      font-family: var(--font-sans);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Fixed Celestial Canvas Background */
    #ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1160px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    /* 3D Tilt Card */
    .tilt-card {
      background: #FFFFFF;
      border: 1.5px solid var(--c-border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 12px 32px -4px rgba(0, 4, 17, 0.06), 0 4px 12px -2px rgba(0, 4, 17, 0.02);
      transition: transform 0.2s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.2s ease;
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }
    .tilt-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle 350px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(248, 51, 60, 0.05), transparent 70%);
      pointer-events: none;
      border-radius: inherit;
    }

    /* Animated Number Plate Display (Etale 52 Style) */
    .number-plate-cluster {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--c-night);
      padding: 12px 20px;
      border-radius: 14px;
      border: 2px solid #1E293B;
      box-shadow: 0 8px 24px rgba(0, 4, 17, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .plate-currency-symbol {
      color: var(--c-gold);
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 800;
      margin-right: 4px;
    }
    .plate-digit-slot {
      position: relative;
      width: 28px;
      height: 48px;
      background: linear-gradient(180deg, #111827 0%, #030712 100%);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(229, 169, 60, 0.35);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,0.4);
    }
    .plate-digit-slot::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 1px 1px rgba(0,0,0,0.8);
      z-index: 2;
    }
    .plate-digit-ribbon {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .plate-digit-item {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-family: var(--font-sans);
      font-size: 26px;
      font-weight: 800;
      font-feature-settings: 'tnum';
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .plate-separator {
      color: var(--c-gold);
      font-size: 28px;
      font-weight: 800;
      padding: 0 2px;
      line-height: 48px;
    }

    /* Tactile Buttons with Emil Kowalski Active Feedback */
    .btn-lux {
      background: var(--c-crimson);
      color: #FFFFFF;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px -4px rgba(248, 51, 60, 0.35);
      transition: transform 0.12s var(--ease-out), box-shadow 0.15s ease, background 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-lux:hover {
      background: #D91C25;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px rgba(248, 51, 60, 0.45);
    }
    .btn-lux:active {
      transform: scale(0.97);
    }

    /* Coin Burst Sparkle Particle */
    .sparkle-particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 99999;
      transform: translate(-50%, -50%);
      animation: sparkleFloat 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
    @keyframes sparkleFloat {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3);
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Luxury Canvas Background -->
  <canvas id="ambient-canvas"></canvas>

  <div class="container">
    <div class="tilt-card" id="test-card">
      <div style="font-size: 12px; font-weight: 800; color: var(--c-crimson); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px;">
        🏛️ ETALE 52 NUMBER PLATE SIMULATION
      </div>
      <h2 style="font-family: var(--font-serif); font-size: 32px; font-weight: 800; margin-bottom: 20px;">
        Auspicious Shagun Live Number Plates
      </h2>
      
      <div style="margin-bottom: 28px;">
        <div id="number-plates-mount" class="number-plate-cluster"></div>
      </div>

      <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
        <button class="btn-lux" onclick="triggerLuckySparkle(event); updatePlates(Math.floor(100000 + Math.random() * 900000))">
          <span>🪙</span> <span>Randomize Shagun Blessing</span>
        </button>
        <span style="font-size: 13px; color: #64748B;">Move mouse over card for 3D perspective tilt & specular glow.</span>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. AMBIENT CELESTIAL CANVAS PARTICLES
    // -------------------------------------------------------------
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const PARTICLE_COUNT = 38;
    let mouse = { x: width / 2, y: height / 2, targetX: width / 2, targetY: height / 2 };

    window.addEventListener('mousemove', (e) => {
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
    });

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,
        radius: Math.random() * 2.2 + 1,
        color: Math.random() > 0.4 ? 'rgba(229, 169, 60, ' : 'rgba(248, 51, 60, ',
        alpha: Math.random() * 0.45 + 0.2,
        phase: Math.random() * Math.PI * 2
      });
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, width, height);

      // Smooth mouse damping
      mouse.x += (mouse.targetX - mouse.x) * 0.05;
      mouse.y += (mouse.targetY - mouse.y) * 0.05;

      // Update and draw particles
      particles.forEach((p, idx) => {
        p.phase += 0.02;
        p.x += p.vx + Math.sin(p.phase) * 0.2;
        p.y += p.vy + Math.cos(p.phase) * 0.2;

        // Mouse gentle repulsion
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 180) {
          const force = (180 - dist) / 180;
          p.x += (dx / dist) * force * 1.5;
          p.y += (dy / dist) * force * 1.5;
        }

        // Screen wrap
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color + p.alpha + ')';
        ctx.fill();

        // Connect nearby particles with subtle filament lines
        for (let j = idx + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const lineDx = p.x - p2.x;
          const lineDy = p.y - p2.y;
          const lineDist = Math.sqrt(lineDx * lineDx + lineDy * lineDy);
          if (lineDist < 95) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(229, 169, 60, ${(1 - lineDist / 95) * 0.15})`;
            ctx.lineWidth = 0.75;
            ctx.stroke();
          }
        }
      });

      requestAnimationFrame(renderCanvas);
    }
    renderCanvas();

    // -------------------------------------------------------------
    // 2. 3D CARD TILT ON MOUSEMOVE
    // -------------------------------------------------------------
    const card = document.getElementById('test-card');
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const rotateX = -(y / rect.height) * 10;
      const rotateY = (x / rect.width) * 10;

      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
      card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
      card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)`;
    });

    // -------------------------------------------------------------
    // 3. ANIMATED NUMBER PLATES (Etale 52 Style)
    // -------------------------------------------------------------
    function renderNumberPlates(containerId, value) {
      const container = document.getElementById(containerId);
      if (!container) return;

      const formatted = Number(value).toLocaleString('en-IN');
      container.innerHTML = '<span class="plate-currency-symbol">₹</span>';

      for (let i = 0; i < formatted.length; i++) {
        const char = formatted[i];
        if (char === ',') {
          const comma = document.createElement('span');
          comma.className = 'plate-separator';
          comma.innerText = ',';
          container.appendChild(comma);
        } else {
          const slot = document.createElement('div');
          slot.className = 'plate-digit-slot';

          const ribbon = document.createElement('div');
          ribbon.className = 'plate-digit-ribbon';

          for (let d = 0; d <= 9; d++) {
            const digitItem = document.createElement('div');
            digitItem.className = 'plate-digit-item';
            digitItem.innerText = d;
            ribbon.appendChild(digitItem);
          }

          slot.appendChild(ribbon);
          container.appendChild(slot);

          // Animate ribbon to target digit with stagger
          const targetDigit = parseInt(char, 10) || 0;
          setTimeout(() => {
            ribbon.style.transform = `translateY(-${targetDigit * 48}px)`;
          }, i * 40);
        }
      }
    }

    function updatePlates(val) {
      renderNumberPlates('number-plates-mount', val);
    }
    updatePlates(842116);

    // -------------------------------------------------------------
    // 4. GOLDEN COIN SPARKLE BURST EFFECT
    // -------------------------------------------------------------
    function triggerLuckySparkle(e) {
      const x = e.clientX || window.innerWidth / 2;
      const y = e.clientY || window.innerHeight / 2;
      const count = 14;

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'sparkle-particle';
        const size = Math.random() * 6 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 70 + 30;
        const dx = Math.cos(angle) * velocity;
        const dy = Math.sin(angle) * velocity - 30; // slight upward float

        p.style.setProperty('--dx', `${dx}px`);
        p.style.setProperty('--dy', `${dy}px`);
        p.style.background = Math.random() > 0.3 ? '#E5A93C' : '#F8333C';
        p.style.boxShadow = `0 0 8px ${p.style.background}`;

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 700);
      }
    }
  </script>
</body>
</html>
