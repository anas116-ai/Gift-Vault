<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42060F" />
      <stop offset="50%" stop-color="#240308" />
      <stop offset="100%" stop-color="#0E0103" />
    </linearGradient>
    <linearGradient id="gold24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.32" />
    </filter>
  </defs>

  <g id="geometric-gift-gv" filter="url(#boxShadow)">
    <!-- 1. THE SQUARE LUXURY GIFT BOX -->
    <rect x="36" y="58" width="128" height="120" rx="16" fill="url(#boxBg)" stroke="url(#gold24)" stroke-width="1.5" />

    <!-- 2. 'G' GOLD RIBBON ON LEFT HALF OF GIFT BOX -->
    <path d="
      M 52,78
      L 94,78
      L 94,92
      L 68,92
      L 68,144
      L 94,144
      L 94,118
      L 82,118
      L 82,106
      L 104,106
      L 104,158
      L 52,158
      Z
    " fill="url(#gold24)" />

    <!-- 3. 'V' GOLD RIBBON ON RIGHT HALF OF GIFT BOX -->
    <path d="
      M 112,78
      L 126,78
      L 137,136
      L 148,78
      L 162,78
      L 144,158
      L 130,158
      Z
    " fill="url(#goldGleam)" />

    <!-- 4. HORIZONTAL GOLD RIBBON SEAM ACROSS BOX -->
    <line x1="36" y1="58" x2="164" y2="58" stroke="url(#gold24)" stroke-width="3" />

    <!-- 5. 24K ROYAL GOLD GIFT BOW ATOP BOX -->
    <!-- Left Bow Loop -->
    <path d="
      M 100,58
      C 82,32 54,28 44,40
      C 34,52 50,62 78,60
      C 90,60 98,59 100,58
      Z
    " fill="url(#goldGleam)" />
    <!-- Right Bow Loop -->
    <path d="
      M 100,58
      C 118,32 146,28 156,40
      C 166,52 150,62 122,60
      C 110,60 102,59 100,58
      Z
    " fill="url(#gold24)" />
    <!-- Center Ribbon Knot Jewel -->
    <polygon points="100,50 108,58 100,66 92,58" fill="url(#goldGleam)" stroke="#D49922" stroke-width="1" />
    <circle cx="100" cy="58" r="2.5" fill="#FFFFFF" />
  </g>
</svg>