<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boxVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0711" />
      <stop offset="60%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>

    <linearGradient id="boxFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>

    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="25%" stop-color="#F2C748" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#885A0E" />
    </linearGradient>

    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FCE48D" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>

    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g id="minimal-gift-gv" filter="url(#giftShadow)">
    <!-- ==================== 1. THE GIFT BOX (CUBE / SHIELD) ==================== -->
    <!-- Left Face of Gift Box forming 'G' -->
    <!-- Outer boundary of Left Box Face -->
    <path d="
      M 34,70
      L 94,70
      L 80,94
      L 58,94
      L 88,146
      L 100,126
      L 122,126
      L 112,146
      L 100,168
      L 34,70
      Z
    " fill="url(#boxFacet)" />

    <!-- Right Face of Gift Box forming 'V' -->
    <path d="
      M 100,188
      L 100,146
      L 134,88
      L 156,88
      L 116,158
      L 166,70
      Z
    " fill="url(#boxVelvet)" />

    <!-- G Inner Horizontal Ribbon Bar -->
    <polygon points="100,126 128,126 120,140 92,140" fill="url(#gold24k)" />

    <!-- Vertical Center Ribbon (Seam of the Gift Box) -->
    <polygon points="98,70 102,70 102,188 98,188" fill="url(#goldGleam)" />

    <!-- ==================== 2. LUXURY GOLD GIFT BOW ATOP ==================== -->
    <!-- Left Ribbon Bow Loop -->
    <path d="
      M 100,66
      C 84,42 56,36 46,48
      C 36,60 52,72 82,70
      Z
    " fill="url(#goldGleam)" />

    <!-- Right Ribbon Bow Loop -->
    <path d="
      M 100,66
      C 116,42 144,36 154,48
      C 164,60 148,72 118,70
      Z
    " fill="url(#gold24k)" />

    <!-- Central Gift Knot Jewel -->
    <rect x="94" y="60" width="12" height="12" rx="2" transform="rotate(45 100 66)" fill="url(#goldGleam)" stroke="#D49922" stroke-width="1" />
    <circle cx="100" cy="66" r="2.5" fill="#FFFFFF" />

    <!-- Left & Right Hanging Ribbon Tails -->
    <polygon points="96,72 80,96 90,96 100,74" fill="url(#gold24k)" />
    <polygon points="104,72 120,96 110,96 100,74" fill="url(#goldGleam)" />
  </g>
</svg>