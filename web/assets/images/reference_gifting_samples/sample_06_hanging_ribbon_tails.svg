<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <!-- Deep Obsidian Burgundy Gradient -->
    <linearGradient id="refDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36050C" />
      <stop offset="50%" stop-color="#1E0206" />
      <stop offset="100%" stop-color="#0E0103" />
    </linearGradient>

    <!-- Obsidian Bevel Highlight -->
    <linearGradient id="refDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E0206" />
      <stop offset="100%" stop-color="#4C0A14" />
    </linearGradient>

    <!-- 24K Champagne Gold Gradient -->
    <linearGradient id="refGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="25%" stop-color="#F2C74B" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#885A0D" />
    </linearGradient>

    <!-- Gold Gleam -->
    <linearGradient id="refGoldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>

    <filter id="refShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.32" />
    </filter>
  </defs>

  <g filter="url(#refShadow)">
    <!-- Base Reference Monogram (G and V in deep obsidian) -->
    <path d="
      M 30,50
      L 94,50
      L 80,76
      L 54,76
      L 88,142
      L 100,118
      L 126,118
      L 114,142
      L 100,166
      L 136,92
      L 150,92
      L 100,188
      Z
    " fill="url(#refDark)" />
    
    <!-- Top-Right Gold Accent Triangle -->
    <polygon points="128,50 170,50 148,92" fill="url(#refGold)" />

    <!-- Top Gift Bow -->
    <path d="M 100,50 C 82,26 58,24 50,34 C 42,44 56,52 80,50 Z" fill="url(#refGoldGleam)" />
    <path d="M 100,50 C 118,26 142,24 150,34 C 158,44 144,52 120,50 Z" fill="url(#refGold)" />
    <circle cx="100" cy="50" r="3" fill="#FFF" />

    <!-- GIFTING ELEMENT: Satin Ribbon Tails Cascading Down Inner V -->
    <!-- Left Ribbon Tail crossing inside V -->
    <path d="M 96,54 L 84,106 L 94,106 L 102,58 Z" fill="url(#refGoldGleam)" opacity="0.9" />
    <!-- Right Ribbon Tail crossing inside V -->
    <path d="M 104,54 L 118,106 L 108,106 L 98,58 Z" fill="url(#refGold)" opacity="0.9" />
  </g>
</svg>