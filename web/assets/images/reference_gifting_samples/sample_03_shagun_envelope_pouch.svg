<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <!-- Deep Obsidian Burgundy Gradient -->
    <linearGradient id="refDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36050C" />
      <stop offset="50%" stop-color="#1E0206" />
      <stop offset="100%" stop-color="#0E0103" />
    </linearGradient>

    <!-- Obsidian Bevel Highlight -->
    <linearGradient id="refDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E0206" />
      <stop offset="100%" stop-color="#4C0A14" />
    </linearGradient>

    <!-- 24K Champagne Gold Gradient -->
    <linearGradient id="refGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="25%" stop-color="#F2C74B" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#885A0D" />
    </linearGradient>

    <!-- Gold Gleam -->
    <linearGradient id="refGoldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>

    <filter id="refShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.32" />
    </filter>
  </defs>

  <g filter="url(#refShadow)">
    <!-- The Inverted Triangle acts as a Shagun Envelope Pouch -->
    <path d="
      M 30,46
      L 94,46
      L 80,72
      L 54,72
      L 88,138
      L 100,114
      L 126,114
      L 114,138
      L 100,162
      L 136,88
      L 150,88
      L 100,184
      Z
    " fill="url(#refDark)" />

    <!-- Lifted Gold Envelope Flap (The top-right corner) with 3D fold -->
    <polygon points="128,46 170,46 148,88" fill="url(#refGoldGleam)" />
    <polygon points="128,46 148,88 138,70" fill="url(#refGold)" />

    <!-- Diagonal Envelope Folding Seam from top-left to gold flap -->
    <line x1="30" y1="46" x2="128" y2="46" stroke="url(#refGold)" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Auspicious Gold Shagun Coin Seal at Center Flap -->
    <circle cx="100" cy="80" r="14" fill="url(#refGold)" stroke="#D49922" stroke-width="1.5" />
    <circle cx="100" cy="80" r="11" fill="none" stroke="#FFF" stroke-width="0.8" stroke-dasharray="2,2" />
    <text x="100" y="84" font-family="'Cinzel', serif" font-size="10" font-weight="900" fill="#36050C" text-anchor="middle">₹1</text>
  </g>
</svg>