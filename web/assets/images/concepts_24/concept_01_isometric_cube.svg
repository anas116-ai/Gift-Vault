<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <polygon points="100,26 162,54 100,82 38,54" fill="url(#gDarkFacet)" stroke="url(#gGold)" stroke-width="1.2" />
    <polygon points="100,26 105,28 105,80 100,82 95,80 95,28" fill="url(#gGold)" />
    <polygon points="38,54 44,51 156,57 162,54 156,51 44,57" fill="url(#gGleam)" />
    <polygon points="38,54 100,82 100,166 38,138" fill="url(#gDark)" />
    <!-- G cut on left face -->
    <path d="M 48,68 L 90,87 L 84,98 L 60,88 L 60,122 L 86,134 L 86,116 L 72,110 L 74,102 L 94,110 L 94,146 L 48,126 Z" fill="url(#gGold)" />
    <!-- V cut on right face -->
    <polygon points="100,82 162,54 162,138 100,166" fill="url(#gDarkFacet)" />
    <path d="M 108,88 L 118,92 L 132,136 L 146,80 L 156,76 L 136,148 L 126,148 Z" fill="url(#gGleam)" />
    <!-- Gift Bow atop -->
    <path d="M 100,26 C 80,8 56,8 48,18 C 40,28 54,38 78,36 Z" fill="url(#gGleam)" />
    <path d="M 100,26 C 120,8 144,8 152,18 C 160,28 146,38 122,36 Z" fill="url(#gGold)" />
    <circle cx="100" cy="26" r="3.5" fill="#FFF" />
  </g>
</svg>