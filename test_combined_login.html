<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Combined Login Test</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: radial-gradient(circle at 50% 25%, #252D37 0%, #161A20 55%, #0B0E12 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 24px 32px;
  color: #0F172A;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1060px;
  width: 100%;
  margin: 0 auto 16px;
}

.btn-back {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #FFFFFF;
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
}
.btn-back:hover {
  background: rgba(255, 255, 255, 0.22);
  transform: translateX(-2px);
}

.trust-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #CBD5E1;
  font-size: 12px;
  font-weight: 600;
}

/* Master Floating Split Card */
.combined-master-card {
  max-width: 1080px;
  width: 100%;
  min-height: 620px;
  margin: auto;
  display: grid;
  grid-template-columns: 1.08fr 0.92fr;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.12);
  background: #FAF7F2;
}

/* LEFT SIDE: Image 1 Exact Wedding Scene */
.combined-left-scene {
  position: relative;
  overflow: hidden;
  background: #1A050A;
}
.combined-left-scene img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* RIGHT SIDE: Image 2 Exact Ivory Card */
.combined-right-pane {
  background: #FAF7F2;
  padding: 40px 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* Auth Card matching Image 2 */
.exact-auth-card {
  max-width: 420px;
  width: 100%;
  background: #FFFDF9;
  border: 1.5px solid rgba(226, 218, 205, 0.8);
  border-radius: 24px;
  padding: 38px 36px 32px;
  box-shadow: 0 15px 35px -5px rgba(15, 23, 42, 0.05), 0 5px 15px rgba(0, 0, 0, 0.02);
  position: relative;
}

/* Top Right 3-dots */
.card-dots-menu {
  position: absolute;
  top: 18px;
  right: 20px;
  color: #CBD5E1;
  font-size: 16px;
  cursor: pointer;
  line-height: 1;
}

/* Brand Logo from Image 2 */
.brand-lockup {
  text-align: center;
  margin-bottom: 24px;
}
.brand-name {
  font-family: 'Outfit', sans-serif;
  font-size: 34px;
  font-weight: 700;
  color: #8B1528;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.brand-v-swoosh {
  color: #B38438;
  font-family: 'Cinzel', serif;
  font-style: italic;
  display: inline-block;
}
.brand-subtitle {
  font-family: 'Cinzel', serif;
  font-size: 13.5px;
  font-weight: 700;
  color: #B38438;
  letter-spacing: 0.08em;
  margin-top: 3px;
}

/* Form Styles from Image 2 */
.form-field-group {
  margin-bottom: 18px;
}
.field-label {
  display: block;
  font-size: 13.5px;
  font-weight: 600;
  color: #1F2937;
  margin-bottom: 8px;
}

.phone-input-container {
  display: flex;
  align-items: center;
  border: 1.5px solid #D1D5DB;
  border-radius: 12px;
  background: #FFFFFF;
  padding: 4px 14px;
  transition: all 0.2s ease;
}
.phone-input-container:focus-within {
  border-color: #8B1528;
  box-shadow: 0 0 0 3px rgba(139, 21, 40, 0.08);
}
.phone-prefix {
  font-size: 15px;
  font-weight: 700;
  color: #111827;
  padding-right: 12px;
  border-right: 1.5px solid #E5E7EB;
  user-select: none;
}
.phone-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  padding: 9px 0 9px 12px;
  font-size: 15px;
  font-family: inherit;
  color: #111827;
}

/* 6 OTP boxes matching Image 2 */
.otp-boxes-row {
  display: flex;
  gap: 8px;
  justify-content: space-between;
}
.otp-box {
  width: 44px;
  height: 48px;
  border: 1.5px solid #D1D5DB;
  border-radius: 10px;
  text-align: center;
  font-size: 19px;
  font-weight: 700;
  color: #111827;
  background: #FFFFFF;
  outline: none;
  transition: all 0.2s ease;
}
.otp-box:focus {
  border-color: #8B1528;
  box-shadow: 0 0 0 3px rgba(139, 21, 40, 0.08);
}

/* Primary Crimson Pill Button matching Image 2 */
.btn-enter-vault {
  width: 100%;
  background: #9E1B32;
  color: #FFFFFF;
  border-radius: 999px;
  padding: 14px 28px;
  font-family: 'Cinzel', serif;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  border: none;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(158, 27, 50, 0.32);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  margin-top: 22px;
}
.btn-enter-vault:hover {
  background: #801326;
  transform: translateY(-1px);
  box-shadow: 0 10px 26px rgba(158, 27, 50, 0.4);
}

.resend-row {
  text-align: center;
  margin-top: 12px;
  font-size: 12.5px;
  color: #4B5563;
  font-weight: 500;
}

.need-help-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 20px;
  font-size: 13px;
  font-weight: 600;
  color: #1F2937;
  cursor: pointer;
  text-decoration: none;
}
.need-help-link:hover {
  color: #8B1528;
}

.security-strip {
  text-align: center;
  font-size: 11px;
  color: #6B7280;
  margin-top: 6px;
}

/* Guest Demo fast-pass */
.btn-guest-pass {
  margin-top: 14px;
  width: 100%;
  background: #FFF5F6;
  border: 1px dashed rgba(158, 27, 50, 0.4);
  border-radius: 999px;
  padding: 10px 20px;
  font-size: 12px;
  font-weight: 700;
  color: #9E1B32;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-guest-pass:hover {
  background: #FEE2E2;
}

/* Responsive */
@media (max-width: 960px) {
  .combined-master-card {
    grid-template-columns: 1fr;
  }
  .combined-left-scene {
    min-height: 340px;
  }
}
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="btn-back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Back to Celebrations</span>
    </button>
    <div class="trust-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>256-Bit SSL Encrypted Vault</span>
    </div>
  </div>

  <!-- Master Center Floating Card Combining Image 1 and Image 2 -->
  <div class="combined-master-card">
    
    <!-- LEFT PANEL: Image 1 Exact Wedding Scene -->
    <div class="combined-left-scene">
      <img src="assets/images/giftvault_login_showcase_final.jpg" alt="GiftVault Celebration Counter Scene">
    </div>

    <!-- RIGHT PANEL: Image 2 Exact Ivory Card -->
    <div class="combined-right-pane">
      <div class="exact-auth-card">
        
        <!-- 3 dots top right from Image 2 -->
        <div class="card-dots-menu">⋮</div>

        <!-- Brand Logo Lockup from Image 2 -->
        <div class="brand-lockup">
          <div class="brand-name">
            Gift<span class="brand-v-swoosh">V</span>ault
          </div>
          <div class="brand-subtitle">The Sacred Ledger</div>
        </div>

        <form onsubmit="event.preventDefault()">
          <!-- Phone Number Field from Image 2 -->
          <div class="form-field-group">
            <label class="field-label">Phone Number</label>
            <div class="phone-input-container">
              <span class="phone-prefix">+91</span>
              <input type="tel" id="login-mobile-input" class="phone-input" placeholder="Mobile Number" value="9876543210" maxlength="10">
            </div>
          </div>

          <!-- 6-digit OTP fields from Image 2 -->
          <div class="form-field-group">
            <label class="field-label">Enter 6-digit OTP</label>
            <div class="otp-boxes-row">
              <input type="text" id="otp-1" class="otp-box" value="1" maxlength="1">
              <input type="text" id="otp-2" class="otp-box" value="2" maxlength="1">
              <input type="text" id="otp-3" class="otp-box" value="3" maxlength="1">
              <input type="text" id="otp-4" class="otp-box" value="4" maxlength="1">
              <input type="text" id="otp-5" class="otp-box" value="5" maxlength="1">
              <input type="text" id="otp-6" class="otp-box" value="6" maxlength="1">
            </div>
          </div>

          <!-- Enter Family Vault Button from Image 2 -->
          <button type="submit" class="btn-enter-vault">
            Enter Family Vault
          </button>

          <!-- Resend OTP from Image 2 -->
          <div class="resend-row">
            Resend OTP (58s)
          </div>

          <!-- Need Help? from Image 2 -->
          <a class="need-help-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Need Help?</span>
          </a>

          <!-- Security Badges from Image 2 -->
          <div class="security-strip">
            256-Bit Vault Security | End-to-End Encrypted
          </div>

          <!-- Guest Demo Pass -->
          <button type="button" class="btn-guest-pass" onclick="enterGuestDemoMode()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span>Continue as Guest (1-Click Demo)</span>
          </button>
        </form>

      </div>
    </div>

  </div>

  <script>
    function enterGuestDemoMode() {
      alert('Guest demo active!');
    }
  </script>
</body>
</html>
