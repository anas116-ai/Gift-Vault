<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <rect x="36" y="60" width="128" height="120" rx="16" fill="url(#gDark)" stroke="url(#gGold)" stroke-width="1.5" />
    <rect x="34" y="60" width="132" height="14" rx="7" fill="url(#gDarkFacet)" stroke="url(#gGold)" stroke-width="1.2" />
    <!-- G Ribbon -->
    <path d="M 50,86 L 94,86 L 94,100 L 66,100 L 66,150 L 94,150 L 94,124 L 80,124 L 80,112 L 106,112 L 106,164 L 50,164 Z" fill="url(#gGold)" />
    <!-- V Ribbon -->
    <path d="M 112,86 L 128,86 L 139,142 L 150,86 L 166,86 L 147,164 L 131,164 Z" fill="url(#gGleam)" />
    <!-- Bow -->
    <path d="M 100,60 C 76,32 46,28 36,40 C 26,52 44,66 74,63 Z" fill="url(#gGleam)" />
    <path d="M 100,60 C 124,32 154,28 164,40 C 174,52 156,66 126,63 Z" fill="url(#gGold)" />
    <polygon points="100,50 110,60 100,70 90,60" fill="url(#gGleam)" />
    <circle cx="100" cy="60" r="2.5" fill="#FFF" />
  </g>
</svg>