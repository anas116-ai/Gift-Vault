<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <rect x="38" y="56" width="124" height="120" rx="22" fill="#FAF5ED" stroke="url(#gGold)" stroke-width="2" opacity="0.9" />
    <!-- Frosted Inner Layer -->
    <rect x="46" y="64" width="108" height="104" rx="16" fill="rgba(255,255,255,0.7)" stroke="rgba(212,175,55,0.4)" stroke-width="1" />
    <!-- Floating Gold GV Ribbon in core -->
    <path d="M 58,86 L 94,86 L 94,98 L 74,98 L 74,142 L 94,142 L 94,122 L 84,122 L 84,112 L 102,112 L 102,152 L 58,152 Z" fill="url(#gGold)" />
    <path d="M 112,86 L 126,86 L 136,140 L 146,86 L 160,86 L 142,152 L 128,152 Z" fill="url(#gGleam)" />
    <!-- Glass bow atop -->
    <path d="M 100,56 C 82,32 58,30 50,40 C 42,50 56,58 80,56 Z" fill="url(#gGleam)" />
    <path d="M 100,56 C 118,32 142,30 150,40 C 158,50 144,58 120,56 Z" fill="url(#gGold)" />
    <circle cx="100" cy="56" r="3" fill="#FFF" />
  </g>
</svg>