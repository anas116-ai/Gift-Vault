<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <rect x="36" y="58" width="128" height="120" rx="18" fill="url(#gDark)" stroke="url(#gGold)" stroke-width="1.5" />
    <!-- Golden Keyhole forming G and V center -->
    <circle cx="100" cy="100" r="16" fill="url(#gGold)" />
    <polygon points="94,106 106,106 112,138 88,138" fill="url(#gGold)" />
    <circle cx="100" cy="100" r="6" fill="#120104" />
    <polygon points="97,102 103,102 105,124 95,124" fill="#120104" />
    <!-- G and V engraved side accents -->
    <text x="64" y="130" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="url(#gGleam)">G</text>
    <text x="124" y="130" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="url(#gGleam)">V</text>
    <!-- Bow atop -->
    <path d="M 100,58 C 82,34 56,32 48,44 C 40,56 56,64 80,62 Z" fill="url(#gGleam)" />
    <path d="M 100,58 C 118,34 144,32 152,44 C 160,56 144,64 120,62 Z" fill="url(#gGold)" />
    <circle cx="100" cy="58" r="3" fill="#FFF" />
  </g>
</svg>