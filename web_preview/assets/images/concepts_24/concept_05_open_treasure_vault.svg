<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <!-- Floating open lid -->
    <polygon points="100,14 162,38 100,56 38,38" fill="url(#gDarkFacet)" stroke="url(#gGold)" stroke-width="1.5" />
    <path d="M 100,14 C 85,2 65,4 60,12 C 55,20 68,26 85,22 Z" fill="url(#gGleam)" />
    <path d="M 100,14 C 115,2 135,4 140,12 C 145,20 132,26 115,22 Z" fill="url(#gGold)" />
    <!-- Open box base -->
    <polygon points="38,72 100,94 100,174 38,150" fill="url(#gDark)" />
    <polygon points="100,94 162,72 162,150 100,174" fill="url(#gDarkFacet)" />
    <!-- Glowing GV Treasure Crest rising from inside -->
    <path d="M 68,76 L 100,88 L 88,136 L 56,124 Z" fill="url(#gGold)" opacity="0.9" />
    <path d="M 100,88 L 132,76 L 144,124 L 112,136 Z" fill="url(#gGleam)" opacity="0.9" />
    <circle cx="100" cy="80" r="14" fill="url(#gGleam)" opacity="0.85" />
    <text x="100" y="85" font-family="'Cinzel', serif" font-size="12" font-weight="900" fill="#37000A" text-anchor="middle">GV</text>
  </g>
</svg>