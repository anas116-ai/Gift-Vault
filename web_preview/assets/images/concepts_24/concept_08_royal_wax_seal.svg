<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <circle cx="100" cy="100" r="76" fill="url(#gDark)" stroke="url(#gGold)" stroke-width="3" />
    <circle cx="100" cy="100" r="70" fill="none" stroke="url(#gGold)" stroke-width="1" stroke-dasharray="3,3" />
    <!-- Embossed Gift Box inside Medallion -->
    <rect x="62" y="78" width="76" height="66" rx="8" fill="url(#gDarkFacet)" stroke="url(#gGold)" stroke-width="1.5" />
    <!-- GV Ribbon in Gold -->
    <text x="100" y="122" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="url(#gGleam)" text-anchor="middle" letter-spacing="1">GV</text>
    <!-- Elegant Ribbon Bow atop the box -->
    <path d="M 100,78 C 86,58 66,56 60,66 C 54,74 66,80 84,79 Z" fill="url(#gGleam)" />
    <path d="M 100,78 C 114,58 134,56 140,66 C 146,74 134,80 116,79 Z" fill="url(#gGold)" />
    <circle cx="100" cy="78" r="3" fill="#FFF" />
  </g>
</svg>