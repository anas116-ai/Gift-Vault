<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Rich Imperial Burgundy Gradients -->
    <linearGradient id="gvBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a31d36"/>
      <stop offset="50%" stop-color="#821427"/>
      <stop offset="100%" stop-color="#5e0b19"/>
    </linearGradient>

    <linearGradient id="gvRibbonShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ba2644"/>
      <stop offset="100%" stop-color="#7a1224"/>
    </linearGradient>

    <!-- Deep Luxury Onyx Charcoal -->
    <linearGradient id="gvOnyx" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
  </defs>

  <!-- ==========================================
       1. TOP GIFT BOW & RIBBON (PRECISION VECTOR)
       ========================================== -->
  <g id="gift-ribbon-bow">
    <!-- Left Ribbon Tail (Swallowtail V-Cut) -->
    <path d="M 96 55 
             L 46 42 
             L 24 36 
             L 34 44 
             L 26 53 
             L 48 52 
             L 94 59 Z" 
          fill="url(#gvBurgundy)"/>

    <!-- Right Ribbon Tail (Swallowtail V-Cut) -->
    <path d="M 104 55 
             L 154 42 
             L 176 36 
             L 166 44 
             L 174 53 
             L 152 52 
             L 106 59 Z" 
          fill="url(#gvBurgundy)"/>

    <!-- Left Bow Loop Outer (Burgundy Silk) -->
    <path d="M 97 54 
             C 88 40, 72 15, 62 16 
             C 54 17, 50 26, 60 40 
             C 70 51, 88 56, 97 57 Z" 
          fill="url(#gvRibbonShine)"/>

    <!-- Left Bow Loop Inner Shadow (Black Cavity Fold) -->
    <path d="M 62 16 
             C 70 15, 84 34, 91 46 
             C 80 43, 69 33, 62 16 Z" 
          fill="url(#gvOnyx)"/>

    <!-- Right Bow Loop Outer (Burgundy Silk) -->
    <path d="M 103 54 
             C 112 40, 128 15, 138 16 
             C 146 17, 150 26, 140 40 
             C 130 51, 112 56, 103 57 Z" 
          fill="url(#gvRibbonShine)"/>

    <!-- Right Bow Loop Inner Shadow (Black Cavity Fold) -->
    <path d="M 138 16 
             C 130 15, 116 34, 109 46 
             C 120 43, 131 33, 138 16 Z" 
          fill="url(#gvOnyx)"/>

    <!-- Center Gift Knot -->
    <polygon points="95,53 105,53 103,60 97,60" fill="#050608"/>
    <circle cx="100" cy="56.5" r="3" fill="url(#gvBurgundy)"/>
  </g>

  <!-- ==========================================
       2. INVERTED TRIANGULAR MONOGRAM (GV)
       Razor sharp, zero overlapping artifacts
       ========================================== -->
  <g id="gv-triangle-emblem">

    <!-- LEFT HALF: LETTER 'G' -->
    <g id="letter-g">
      <!-- Outer Black Shape of G -->
      <!-- Top bar from (22, 65) to (96, 65) -->
      <!-- Right vertical spur: (96, 65) to (96, 84), step left to (82, 84) -->
      <!-- Inner cavity roof: (82, 84) to (48, 84) -->
      <!-- Outer diagonal: from (22, 65) down to (96, 185) -->
      <path d="M 22 65 
               L 96 65 
               L 96 84 
               L 82 84 
               L 82 80 
               L 48 80 
               L 96 156 
               L 96 185 
               L 22 65 Z" 
            fill="url(#gvOnyx)"/>

      <!-- G Horizontal Crossbar (Tongue in Rich Burgundy) -->
      <polygon points="68,96 96,96 96,108 68,108" fill="url(#gvBurgundy)"/>

      <!-- G Lower Stem Facet (Burgundy Shadow along Central Seam) -->
      <polygon points="82,108 96,108 96,160 82,138" fill="url(#gvBurgundy)"/>
    </g>

    <!-- RIGHT HALF: LETTER 'V' -->
    <g id="letter-v">
      <!-- Top-Right Burgundy Triangle Facet (In Upper Cleft of V) -->
      <polygon points="118,65 152,65 118,108" fill="url(#gvBurgundy)"/>

      <!-- Central Vertical Stem of V (Black) -->
      <polygon points="103,65 118,65 118,128 103,158" fill="url(#gvOnyx)"/>

      <!-- Outer Diagonal Arm of V (Black) -->
      <polygon points="152,65 178,65 103,185 103,158 146,80" fill="url(#gvOnyx)"/>

      <!-- Lower V Junction meeting at bottom point -->
      <polygon points="103,158 118,128 136,100 103,185" fill="url(#gvOnyx)"/>
    </g>

  </g>
</svg>