<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A0D18" />
      <stop offset="100%" stop-color="#2D0308" />
    </linearGradient>
    <linearGradient id="leftFaceG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A050D" />
      <stop offset="100%" stop-color="#140104" />
    </linearGradient>
    <linearGradient id="rightFaceV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240207" />
      <stop offset="100%" stop-color="#0A0102" />
    </linearGradient>
    <linearGradient id="gold24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <filter id="isoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g id="iso-gift-box" filter="url(#isoShadow)">
    <!-- 1. TOP LID (Rhombus) -->
    <polygon points="100,28 162,56 100,84 38,56" fill="url(#lidGrad)" />
    <!-- Lid Golden Ribbon Crossing -->
    <polygon points="100,28 106,31 106,81 100,84 94,81 94,31" fill="url(#gold24)" />
    <polygon points="38,56 44,53 156,59 162,56 156,53 44,59" fill="url(#goldGleam)" opacity="0.85" />

    <!-- 2. LEFT FACE: CHISELED 'G' ON GIFT BOX -->
    <polygon points="38,56 100,84 100,166 38,138" fill="url(#leftFaceG)" />
    <!-- G Golden Inlay Ribbon (Top bar, outer edge, and inward spur) -->
    <path d="
      M 46,68
      L 92,88
      L 86,100
      L 58,88
      L 58,124
      L 86,136
      L 86,118
      L 72,112
      L 74,104
      L 94,112
      L 94,148
      L 46,128
      Z
    " fill="url(#gold24)" />

    <!-- 3. RIGHT FACE: CHISELED 'V' ON GIFT BOX -->
    <polygon points="100,84 162,56 162,138 100,166" fill="url(#rightFaceV)" />
    <!-- V Golden Inlay Ribbon (Descending from top right & left to bottom apex) -->
    <path d="
      M 106,88
      L 116,92
      L 132,136
      L 146,80
      L 156,76
      L 136,148
      L 126,148
      Z
    " fill="url(#goldGleam)" />

    <!-- 4. LUXURY 24K GOLD GIFT BOW ATOP LID -->
    <!-- Left Bow Loop -->
    <path d="
      M 100,28
      C 82,10 58,8 48,18
      C 38,28 52,40 78,38
      C 90,38 98,32 100,28
      Z
    " fill="url(#goldGleam)" />
    <!-- Right Bow Loop -->
    <path d="
      M 100,28
      C 118,10 142,8 152,18
      C 162,28 148,40 122,38
      C 110,38 102,32 100,28
      Z
    " fill="url(#gold24)" />
    <!-- Center Ribbon Knot (Diamond Jewel) -->
    <polygon points="100,20 108,28 100,36 92,28" fill="url(#goldGleam)" stroke="#D49922" stroke-width="1" />
    <circle cx="100" cy="28" r="2.5" fill="#FFFFFF" />
  </g>
</svg>