<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <!-- Deep Obsidian Burgundy Gradient -->
    <linearGradient id="refDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36050C" />
      <stop offset="50%" stop-color="#1E0206" />
      <stop offset="100%" stop-color="#0E0103" />
    </linearGradient>

    <!-- Obsidian Bevel Highlight -->
    <linearGradient id="refDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E0206" />
      <stop offset="100%" stop-color="#4C0A14" />
    </linearGradient>

    <!-- 24K Champagne Gold Gradient -->
    <linearGradient id="refGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="25%" stop-color="#F2C74B" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#885A0D" />
    </linearGradient>

    <!-- Gold Gleam -->
    <linearGradient id="refGoldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>

    <filter id="refShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.32" />
    </filter>
  </defs>

  <g filter="url(#refShadow)">
    <!-- Gift Lid Header Line -->
    <rect x="26" y="38" width="148" height="10" rx="3" fill="url(#refDarkFacet)" stroke="url(#refGold)" stroke-width="1.2" />
    <line x1="26" y1="43" x2="174" y2="43" stroke="url(#refGold)" stroke-width="1" />

    <!-- G 3D Chiseled Body -->
    <path d="
      M 30,48
      L 94,48
      L 80,74
      L 54,74
      L 88,140
      L 100,116
      L 126,116
      L 114,140
      L 100,164
      L 136,90
      L 150,90
      L 100,186
      Z
    " fill="url(#refDark)" />

    <!-- 3D Bevel Facet on Left Arm of G -->
    <polygon points="30,48 94,48 80,74 54,74" fill="url(#refDarkFacet)" />
    <!-- 3D Bevel on G Crossbar -->
    <polygon points="100,116 126,116 114,140 88,140" fill="url(#refDarkFacet)" />

    <!-- 3D Faceted Gold Jewel / Gift Bow Corner -->
    <polygon points="128,48 170,48 148,90" fill="url(#refGoldGleam)" />
    <polygon points="128,48 148,90 138,72" fill="url(#refGold)" />

    <!-- Gift Bow Loops on Lid -->
    <path d="M 100,38 C 84,18 62,16 54,26 C 46,36 60,42 82,40 Z" fill="url(#refGoldGleam)" />
    <path d="M 100,38 C 116,18 138,16 146,26 C 154,36 140,42 118,40 Z" fill="url(#refGold)" />
    <circle cx="100" cy="38" r="3" fill="#FFF" />
  </g>
</svg>