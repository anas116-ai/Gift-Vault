<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <!-- Round Box Top Lid (Oval) -->
    <ellipse cx="100" cy="56" rx="64" ry="24" fill="url(#gDarkFacet)" stroke="url(#gGold)" stroke-width="1.5" />
    <!-- Round Box Body Cylinder -->
    <path d="M 36,56 L 36,140 C 36,164 64,178 100,178 C 136,178 164,164 164,140 L 164,56 Z" fill="url(#gDark)" stroke="url(#gGold)" stroke-width="1.5" />
    <!-- Ribbon Bow atop lid -->
    <path d="M 100,48 C 82,24 58,24 50,34 C 42,44 56,52 80,50 Z" fill="url(#gGleam)" />
    <path d="M 100,48 C 118,24 142,24 150,34 C 158,44 144,52 120,50 Z" fill="url(#gGold)" />
    <circle cx="100" cy="48" r="3" fill="#FFF" />
    <!-- Gold GV Typography Emblem on Curved Box -->
    <text x="100" y="128" font-family="'Cinzel', serif" font-size="34" font-weight="900" fill="url(#gGleam)" text-anchor="middle" letter-spacing="2">GV</text>
  </g>
</svg>