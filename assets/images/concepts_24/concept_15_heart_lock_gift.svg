  <g filter="url(#cShadow)">
    <rect x="38" y="66" width="124" height="112" rx="16" fill="url(#gDark)" stroke="url(#gGold)" stroke-width="1.5" />
    <line x1="38" y1="78" x2="162" y2="78" stroke="url(#gGold)" stroke-width="2" />
