<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DD" />
      <stop offset="25%" stop-color="#F5CB52" />
      <stop offset="70%" stop-color="#D49922" />
      <stop offset="100%" stop-color="#8A5A0D" />
    </linearGradient>
    <linearGradient id="gGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FDE896" />
      <stop offset="100%" stop-color="#D49922" />
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#460711" />
      <stop offset="50%" stop-color="#280308" />
      <stop offset="100%" stop-color="#120104" />
    </linearGradient>
    <linearGradient id="gDarkFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#280308" />
      <stop offset="100%" stop-color="#5E0D19" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cShadow)">
    <rect x="38" y="58" width="124" height="120" rx="20" fill="url(#gDark)" stroke="url(#gGold)" stroke-width="1.8" />
    <rect x="36" y="58" width="128" height="16" rx="8" fill="url(#gDarkFacet)" stroke="url(#gGold)" stroke-width="1.2" />
    <!-- Embedded 24K Gold Coin in Center -->
    <circle cx="100" cy="124" r="38" fill="url(#gGold)" stroke="#D49922" stroke-width="2" />
    <circle cx="100" cy="124" r="34" fill="none" stroke="#FFF" stroke-width="1" stroke-dasharray="2,2" />
    <!-- GV Monogram on Coin -->
    <text x="100" y="134" font-family="'Cinzel', serif" font-size="26" font-weight="900" fill="#37000A" text-anchor="middle">GV</text>
    <!-- Royal Bow on Box -->
    <path d="M 100,58 C 82,34 54,32 46,44 C 38,56 54,64 80,62 Z" fill="url(#gGleam)" />
    <path d="M 100,58 C 118,34 146,32 154,44 C 162,56 146,64 120,62 Z" fill="url(#gGold)" />
    <circle cx="100" cy="58" r="3" fill="#FFF" />
  </g>
</svg>