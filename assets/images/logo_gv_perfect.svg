<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Deep Imperial Burgundy Obsidian Gradient -->
    <linearGradient id="gvObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A050D" />
      <stop offset="50%" stop-color="#220207" />
      <stop offset="100%" stop-color="#100103" />
    </linearGradient>

    <!-- Obsidian Bevel Edge -->
    <linearGradient id="gvBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#220207" />
      <stop offset="100%" stop-color="#5A0D18" />
    </linearGradient>

    <!-- 24K Royal Shagun Gold Gradient -->
    <linearGradient id="shagunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="25%" stop-color="#F3CA55" />
      <stop offset="65%" stop-color="#D49924" />
      <stop offset="100%" stop-color="#885A0F" />
    </linearGradient>

    <!-- Gold Facet Highlight -->
    <linearGradient id="shagunGoldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FCE592" />
      <stop offset="100%" stop-color="#D49924" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="gvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#D4AF37" flood-opacity="0.32" />
    </filter>
  </defs>

  <g id="giftvault-monogram" filter="url(#gvShadow)">
    <!-- Main Obsidian G+V Monogram Ribbon -->
    <path d="
      M 28,38
      L 96,38
      L 82,64
      L 54,64
      L 88,132
      L 100,108
      L 126,108
      L 114,132
      L 100,154
      L 100,154
      L 136,82
      L 150,82
      L 100,182
      Z
    " fill="url(#gvObsidian)" />

    <!-- Left Wing Chisel Highlight Layer for 3D Polish -->
    <polygon points="28,38 96,38 82,64 54,64" fill="url(#gvBevel)" />
    
    <!-- G Crossbar Inward Facet / Lock Notch (G Key Accent) -->
    <polygon points="100,108 126,108 114,132 88,132" fill="url(#gvBevel)" />

    <!-- 24K Shagun Jewel Facets (Top Right Corner Diamond) -->
    <!-- Facet 1: Primary Radiant Gold Triangle -->
    <polygon points="128,38 172,38 150,82" fill="url(#shagunGold)" />
    <!-- Facet 2: 3D Top Light Facet (Upper half) -->
    <polygon points="128,38 172,38 150,60" fill="url(#shagunGoldGleam)" opacity="0.85" />
    
    <!-- Auspicious Micro-Jewel: 1 Shagun Blessing Dot at Center of Balance -->
    <circle cx="100" cy="84" r="2.8" fill="url(#shagunGoldGleam)" />
  </g>
</svg>